name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel in-progress runs for the same PR or branch when a new commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      flatpak: ${{ steps.filter.outputs.flatpak }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - id: filter
        # Detect whether the current change touches anything that can affect
        # the Rust build. Locale-only / docs-only PRs skip the Rust matrix
        # entirely to save Actions minutes (the windows matrix slot is 2× per
        # minute). The workflow file itself is part of the filter so CI tweaks
        # still re-run the job.
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            rust:
              - 'src-tauri/**'
              - '.github/workflows/ci.yml'
            flatpak:
              - 'src-tauri/Cargo.lock'
              - 'package.json'
              - 'packaging/flatpak/**'
              - '.github/workflows/ci.yml'

  rust:
    name: Rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        # Tauri 2 on Linux still uses GTK 3 + WebKitGTK; cpal needs ALSA
        # development headers; the rest mirrors what `cargo check` will
        # link against transitively from the Tauri runtime.
        #
        # Installed directly rather than via cache-apt-pkgs-action on
        # purpose: the runner image's pre-baked apt index pins package
        # versions (e.g. gstreamer1.0-plugins-good, a libwebkit2gtk dep)
        # that the Ubuntu mirror rotates out, so a cached install with no
        # `apt-get update` 404s. The action also keys its cache purely on
        # the package list, so a failed run saves an empty cache that
        # poisons every later run under the same immutable key. `apt-get
        # update` first refreshes the index to whatever the mirror
        # currently serves; skipping the apt cache removes the poison
        # trap. The expensive cache — compiled Rust artifacts — stays on
        # Swatinem/rust-cache below.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev \
            libssl-dev pkg-config

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri

      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --workspace --all-targets

      - name: cargo check (waveflow-core, server profile — no plugin host)
        # Locks in the slim build path the future `waveflow-server` consumes:
        # `default-features = false, features = ["postgres"]`. Without this
        # step a future dep added unconditionally to `waveflow-core` (or a
        # missing `optional = true` on a plugin-only crate) would silently
        # re-introduce the wasmtime + Cranelift transitive tree the server's
        # binary doesn't want. The desktop matrix slot above still exercises
        # the full feature set under `--workspace --all-targets`.
        if: runner.os == 'Linux'
        run: >-
          cargo check
          --manifest-path src-tauri/Cargo.toml
          -p waveflow-core
          --no-default-features
          --features postgres

      - name: cargo test (full workspace)
        if: runner.os == 'Linux'
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace

      - name: cargo test (Windows — exclude the Tauri app crate)
        # The `waveflow` app-crate test binary links the Tauri / WebView2
        # runtime and fails to START headless on windows-latest with
        # STATUS_ENTRYPOINT_NOT_FOUND (exit 0xc0000139) — the loader
        # can't resolve the webview DLL's imports next to a bare test
        # exe. Its unit tests are pure logic and already run on Linux
        # above; the portable crates (`waveflow-core`, …) still run here,
        # and `cargo check --all-targets` above already exercises the app
        # crate's Windows compilation. So skip only the app crate's test
        # binary on Windows rather than losing the whole Windows matrix
        # slot.
        if: runner.os == 'Windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace --exclude waveflow

      - name: cargo test (waveflow-core, sqlite backend)
        # `sqlite` is NOT a default feature of waveflow-core, so the
        # module tree behind it — including the scanner passes that talk
        # to SQLite and their tests — only compiles when something in the
        # build graph turns it on. The Linux `--workspace` run gets that
        # for free via feature unification with the app crate, but the
        # Windows run excludes exactly that crate, so those tests would
        # silently not exist there. Ask for the feature explicitly rather
        # than relying on unification, on both runners.
        run: >
          cargo test
          --manifest-path src-tauri/Cargo.toml
          -p waveflow-core
          --features sqlite

  flatpak-sources:
    name: Flatpak sources
    needs: changes
    if: needs.changes.outputs.flatpak == 'true'
    runs-on: ubuntu-latest
    # Pure JSON/regex comparison — no network, no venv, no npm. Seconds.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # Nothing here pushes; leaving the token out of .git/config
          # keeps it away from the checked-out code entirely.
          persist-credentials: false

      # Flathub builds with the network disabled, so a lockfile bump that
      # skipped `generate-sources.sh` doesn't fail in CI — it fails inside
      # Flathub's sandbox on a crate nobody can download. That already
      # happened once (23be643 left 53 crates undeclared), which is why
      # this guard exists.
      #
      # Coverage only, never freshness: `generate-sources.sh` resolves `^`
      # ranges against the live registry, so "regenerate and diff" would go
      # red whenever any transitive dependency publishes, with nothing
      # wrong in the repo. Refreshing is `flatpak-sources-refresh.yml`'s job.
      - name: Check generated sources cover the lockfiles
        run: python3 packaging/flatpak/check-sources.py

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        # Resolving `bun-version: latest` hits the GitHub API to list
        # `oven-sh/bun` tags. The action reads GITHUB_TOKEN from env to
        # authenticate; without it the request returns 401 ("Bad
        # credentials") on GitHub-hosted runners. The action has no
        # `github-token` input, so we plumb the token through env.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: bun install
        run: bun install --frozen-lockfile

      - name: ESLint
        run: bun run lint

      - name: TypeScript
        run: bun run typecheck

      - name: Vite production build
        run: bun run build
