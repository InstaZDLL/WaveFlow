name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel in-progress runs for the same PR or branch when a new commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs on every pull request, outside the paths filter below, because
  # that filter only lets `ci.yml` wake the Rust job. A pull request that
  # touches `release.yml` alone — exactly the one that forgets a site
  # when bumping the pin — would otherwise be checked by nothing.
  #
  # Kept as its own job rather than folded into the Rust matrix for the
  # same reason it isn't in the filter: this is a text comparison that
  # costs a checkout and a second, and the Rust job costs thirteen
  # minutes (#535). Widening the filter would have spent those minutes
  # on every workflow tweak.
  toolchain-pin:
    name: Toolchain pin
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # The script this job runs comes from the pull request. Leave
          # no token behind in `.git/config` for it to find — the same
          # reason the Flatpak-sources job already does this.
          persist-credentials: false
      # The self-test first: if the parsing is broken, the check below
      # reports "consistent" for reasons that have nothing to do with
      # the workflows. It caught two real splitter bugs during review.
      - run: python3 scripts/check-toolchain-pin.py --self-test
      - run: python3 scripts/check-toolchain-pin.py

  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      flatpak: ${{ steps.filter.outputs.flatpak }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - id: filter
        # Detect whether the current change touches anything that can affect
        # the Rust build. Locale-only / docs-only PRs skip the Rust matrix
        # entirely to save Actions minutes (the windows matrix slot is 2× per
        # minute). The workflow file itself is part of the filter so CI tweaks
        # still re-run the job. So are the three configuration files at the
        # repository root: they decide which compiler runs and what the
        # formatter and clippy accept, so a pull request that changes only
        # one of them is exactly the pull request the Rust job has to see.
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rust:
              - 'src-tauri/**'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              - 'clippy.toml'
              - '.github/workflows/ci.yml'
            flatpak:
              - 'src-tauri/Cargo.lock'
              - 'package.json'
              - 'packaging/flatpak/**'
              - '.github/workflows/ci.yml'

  rust:
    name: Rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        # Tauri 2 on Linux still uses GTK 3 + WebKitGTK; cpal needs ALSA
        # development headers; the rest mirrors what `cargo check` will
        # link against transitively from the Tauri runtime.
        #
        # Installed directly rather than via cache-apt-pkgs-action on
        # purpose: the runner image's pre-baked apt index pins package
        # versions (e.g. gstreamer1.0-plugins-good, a libwebkit2gtk dep)
        # that the Ubuntu mirror rotates out, so a cached install with no
        # `apt-get update` 404s. The action also keys its cache purely on
        # the package list, so a failed run saves an empty cache that
        # poisons every later run under the same immutable key. `apt-get
        # update` first refreshes the index to whatever the mirror
        # currently serves; skipping the apt cache removes the poison
        # trap. The expensive cache — compiled Rust artifacts — stays on
        # Swatinem/rust-cache below.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev \
            libssl-dev pkg-config

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: cargo fmt
        # Both checks run on one runner only: their answer cannot differ by
        # operating system, and `rustfmt.toml` names the version-independent
        # settings they read. Linux because it is the slot that already runs
        # everything else.
        if: runner.os == 'Linux'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: cargo clippy
        # `-D warnings` rather than a warning count: a lint nobody has to fix
        # is a lint everybody scrolls past. The thresholds that would make
        # that unbearable — argument counts, function length, type
        # complexity — are already relaxed in `clippy.toml` to match what the
        # audio engine and the Tauri commands actually look like.
        if: runner.os == 'Linux'
        run: >-
          cargo clippy
          --manifest-path src-tauri/Cargo.toml
          --workspace
          --all-targets
          -- -D warnings

      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --workspace --all-targets

      - name: cargo check (waveflow-core, server profile — no plugin host)
        # Locks in the slim build path the future `waveflow-server` consumes:
        # `default-features = false, features = ["postgres"]`. Without this
        # step a future dep added unconditionally to `waveflow-core` (or a
        # missing `optional = true` on a plugin-only crate) would silently
        # re-introduce the wasmtime + Cranelift transitive tree the server's
        # binary doesn't want. The desktop matrix slot above still exercises
        # the full feature set under `--workspace --all-targets`.
        if: runner.os == 'Linux'
        run: >-
          cargo check
          --manifest-path src-tauri/Cargo.toml
          -p waveflow-core
          --no-default-features
          --features postgres

      - name: cargo test (waveflow app crate — Linux only)
        # sync_v2 (RFC-005) is now in the default feature set, so the
        # `cargo check --workspace --all-targets` step above already
        # compiles every line of `crate::remote`. This step remains to RUN
        # the app crate's tests, which only the Linux slot can — the Windows
        # slot can't start the Tauri test binary (see below). `--features
        # sync_v2` is redundant with the default now, kept explicit so the
        # intent survives a future default change.
        if: runner.os == 'Linux'
        run: >-
          cargo test
          --manifest-path src-tauri/Cargo.toml
          -p waveflow
          --features sync_v2
          --all-targets

      - name: cargo check (opt-out build — no default features)
        # The Flatpak / app-store builds compile with `--no-default-features`
        # (they own updates and don't ship sync_v2's server surface). Now
        # that sync_v2 is default, this is the ONLY step that exercises the
        # code compiled WITHOUT it — the always-present stubs and the
        # local-only halves of shared modules — so they can't rot silently.
        if: runner.os == 'Linux'
        run: >-
          cargo check
          --manifest-path src-tauri/Cargo.toml
          -p waveflow
          --no-default-features
          --all-targets

      - name: cargo test (full workspace)
        if: runner.os == 'Linux'
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace

      - name: cargo test (Windows — exclude the Tauri app crate)
        # The `waveflow` app-crate test binary links the Tauri / WebView2
        # runtime and fails to START headless on windows-latest with
        # STATUS_ENTRYPOINT_NOT_FOUND (exit 0xc0000139) — the loader
        # can't resolve the webview DLL's imports next to a bare test
        # exe. Its unit tests are pure logic and already run on Linux
        # above; the portable crates (`waveflow-core`, …) still run here,
        # and `cargo check --all-targets` above already exercises the app
        # crate's Windows compilation. So skip only the app crate's test
        # binary on Windows rather than losing the whole Windows matrix
        # slot.
        if: runner.os == 'Windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace --exclude waveflow

      - name: cargo test (waveflow-core, sqlite backend)
        # `sqlite` is NOT a default feature of waveflow-core, so the
        # module tree behind it — including the scanner passes that talk
        # to SQLite and their tests — only compiles when something in the
        # build graph turns it on. The Linux `--workspace` run gets that
        # for free via feature unification with the app crate, but the
        # Windows run excludes exactly that crate, so those tests would
        # silently not exist there. Ask for the feature explicitly rather
        # than relying on unification, on both runners.
        run: >
          cargo test
          --manifest-path src-tauri/Cargo.toml
          -p waveflow-core
          --features sqlite

  flatpak-sources:
    name: Flatpak sources
    needs: changes
    if: needs.changes.outputs.flatpak == 'true'
    runs-on: ubuntu-latest
    # Pure JSON/regex comparison — no network, no venv, no npm. Seconds.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # Nothing here pushes; leaving the token out of .git/config
          # keeps it away from the checked-out code entirely.
          persist-credentials: false

      # Flathub builds with the network disabled, so a lockfile bump that
      # skipped `generate-sources.sh` doesn't fail in CI — it fails inside
      # Flathub's sandbox on a crate nobody can download. That already
      # happened once (23be643 left 53 crates undeclared), which is why
      # this guard exists.
      #
      # Coverage only, never freshness: `generate-sources.sh` resolves `^`
      # ranges against the live registry, so "regenerate and diff" would go
      # red whenever any transitive dependency publishes, with nothing
      # wrong in the repo. Refreshing is `flatpak-sources-refresh.yml`'s job.
      # The semver range logic behind the `overrides` check is the only
      # non-obvious code in the script, and it's the kind that fails
      # permissively (accepting a version npm would reject) — so it gets
      # its own table of boundary cases.
      - name: check-sources self-test
        run: python3 packaging/flatpak/check-sources.py --self-test

      - name: Check generated sources cover the lockfiles
        run: python3 packaging/flatpak/check-sources.py

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        # Resolving `bun-version: latest` hits the GitHub API to list
        # `oven-sh/bun` tags. The action reads GITHUB_TOKEN from env to
        # authenticate; without it the request returns 401 ("Bad
        # credentials") on GitHub-hosted runners. The action has no
        # `github-token` input, so we plumb the token through env.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: bun install
        run: bun install --frozen-lockfile

      - name: ESLint
        run: bun run lint

      - name: TypeScript
        run: bun run typecheck

      - name: Vite production build
        run: bun run build
