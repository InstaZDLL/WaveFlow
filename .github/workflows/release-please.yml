name: Release Please

# Observes conventional commits on main and opens / updates a
# "chore(main): release X.Y.Z" PR that bumps every version manifest
# (package.json + src-tauri/tauri.conf.json + src-tauri/Cargo.toml +
# README badge) and regenerates CHANGELOG.md. Merging that PR creates
# the `vX.Y.Z` tag, which fires release.yml on the existing tag
# trigger — so the AUR / Winget / COPR pipeline keeps working
# unchanged downstream.
#
# Cargo.lock is bumped by a companion workflow
# (release-please-bump-lockfile.yml) that listens to the
# release-please PR being opened / synchronized — release-please
# can't bump Cargo.lock natively because it's regenerated by cargo.
#
# **Migrated 2026-05 from `googleapis/release-please-action@v5.0.0`
# (deprecated, bundling an older release-please library) to the
# CLI directly because the action started returning persistent
# 401 "Bad credentials" on its GitHub API calls. The CLI uses the
# same `GITHUB_TOKEN` cleanly. Behaviour is identical from the
# caller's perspective: same release PR branch
# (`release-please--branches--main--components--waveflow`), same
# `github-actions[bot]` author, so the lockfile-build companion
# workflow keeps gating correctly on `startsWith(head_ref,
# 'release-please--')`.**

# Also on maintenance branches (`release/1.9.x`, …): a patch release of a
# shipped line is cut from there, so the features already on main stay
# out of it. Each run targets the branch that was pushed
# (`--target-branch`), and reads that branch's config and manifest.
# A push to a branch runs that branch's copy of this file, so a
# maintenance branch needs this version of it too.
"on":
  push:
    branches: [main, "release/**"]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      # Phase A — when the head commit IS the release PR's merge
      # commit, cut the GitHub release + tag. No-op on every other
      # push, so we can run both phases unconditionally.
      #
      # **First, not second.** Right after a release PR merges, the
      # update below looks for the release of the version the manifest
      # now names; when that release does not exist yet it walks back up
      # to `commit-search-depth` (1500) commits, one API call each, and
      # the job's timeout cut it before this step ever ran — no tag, and
      # a manual rerun on every release (1.8.1, 1.9.0, 1.9.1). Tagged
      # first, the update finds its starting point at once.
      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --yes release-please@17 github-release \
            --token="${GITHUB_TOKEN}" \
            --repo-url="${GITHUB_REPOSITORY}" \
            --target-branch="${GITHUB_REF_NAME}" \
            --config-file=release-please-config.json \
            --manifest-file=.release-please-manifest.json

      # Phase B — open / update the release PR. Idempotent: re-runs
      # on every push, only mutates GitHub when something changed.
      - name: Update release PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --yes release-please@17 release-pr \
            --token="${GITHUB_TOKEN}" \
            --repo-url="${GITHUB_REPOSITORY}" \
            --target-branch="${GITHUB_REF_NAME}" \
            --config-file=release-please-config.json \
            --manifest-file=.release-please-manifest.json
