name: Refresh Flatpak sources

# Regenerates the offline Flatpak source manifests and opens a PR when
# they moved.
#
# Two jobs share the work with `packaging/flatpak/check-sources.py`:
# CI *guards the invariant* (every crate/tarball the build needs is
# declared) on any PR touching a lockfile, and this workflow *refreshes*
# the manifests on a schedule. The split exists because the generator is
# not deterministic: it runs `npm install --package-lock-only`, which
# resolves `^` ranges against the registry as it is right now, so a
# "regenerate and diff the tree" check would go red the moment any
# transitive dependency publishes. Freshness is a periodic chore, not a
# per-PR gate.
#
# Runs on the default branch only (schedule + manual dispatch), so no
# untrusted code reaches the generator — it executes `npm install`
# (with --ignore-scripts) and `pip install` from a pinned upstream
# commit.

"on":
  schedule:
    # 04:00 UTC on the 3rd of each month. Off-hours, and clear of the
    # 1st so it doesn't collide with other month-boundary automation.
    - cron: "0 4 3 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: flatpak-sources-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Regenerate + open PR
    runs-on: ubuntu-latest
    # The cargo generator fetches metadata for ~800 crates and the node
    # one hashes every tarball; ~15 min is typical, 40 leaves headroom
    # for a slow registry rather than failing a chore run.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # `workflow_dispatch` can be pointed at any branch, but the PR
          # below always targets main — generating from another branch's
          # lockfiles would produce sources that don't match the base.
          # Pin the content to main so the two always agree (and so the
          # "default branch only" claim in the header holds).
          ref: main
          # Keep the job's token out of .git/config, where every later
          # step (and anything they execute — this job runs `npm install`
          # and `pip install`) could read it. The push step re-supplies
          # credentials through `gh auth setup-git` instead.
          persist-credentials: false

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Regenerate sources
        run: bash packaging/flatpak/generate-sources.sh

      # Belt and braces: the generator is what we just ran, so this
      # should always pass — but opening a PR that fails the very check
      # CI runs on it would be worse than failing here.
      - name: Verify the result
        run: python3 packaging/flatpak/check-sources.py

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- packaging/flatpak/generated/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Sources already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- packaging/flatpak/generated/
          fi

      - name: Commit + open PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: chore/flatpak-sources-refresh
        run: |
          set -euo pipefail
          # The checkout deliberately didn't persist credentials; this
          # installs a git credential helper backed by GH_TOKEN.
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add packaging/flatpak/generated/
          git commit -m "chore(flatpak): refresh generated sources" \
            -m "Regenerated by the monthly Refresh Flatpak sources workflow." \
            -m "Cargo entries follow src-tauri/Cargo.lock; npm entries re-resolve package.json against the registry, so this also bumps transitive frontend deps for the Flathub build."

          # Explicit lease. A bare `--force-with-lease` compares against
          # the remote-tracking ref, which `actions/checkout` never
          # fetched for this branch — so from the second run on (when the
          # branch already exists remotely) the push dies with "stale
          # info". Reproduced locally before fixing. An empty OID is the
          # documented "must not exist yet" lease, which covers run #1.
          remote_oid=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          git push --force-with-lease="refs/heads/$BRANCH:$remote_oid" \
            origin "HEAD:refs/heads/$BRANCH"

          # Reuse the existing PR when the branch already had one open —
          # the force-push above updated it in place.
          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')
          if [ -n "$existing" ]; then
            echo "PR #$existing updated by the force-push."
            exit 0
          fi

          cat > /tmp/pr-body.md <<'BODY'
          Automated monthly refresh of the offline Flatpak source manifests.

          - `cargo-sources.json` follows `src-tauri/Cargo.lock` exactly.
          - `node-sources.json` + `package-lock.json` re-resolve `package.json`
            against the npm registry, so this also bumps transitive frontend
            dependencies **for the Flathub build only** — the app itself is
            built from `bun.lock`, the Flatpak sandbox runs `npm ci --offline`.

          `packaging/flatpak/check-sources.py` passed in the generating run.

          Note: PRs opened with `GITHUB_TOKEN` don't trigger workflows, so CI
          has not run here. Close and reopen the PR to kick it off.
          BODY

          gh pr create \
            --title "chore(flatpak): refresh generated sources" \
            --body-file /tmp/pr-body.md \
            --base main \
            --head "$BRANCH"
