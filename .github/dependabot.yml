version: 2

updates:
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Zurich"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - bun
    commit-message:
      prefix: chore
    groups:
      bun-patch-and-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: weekly
      day: monday
      time: "06:10"
      timezone: "Europe/Zurich"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - cargo
    commit-message:
      prefix: chore
    groups:
      cargo-patch-and-minor:
        update-types:
          - minor
          - patch
    # `windows-core` is not an independent dependency. `crates/app/Cargo.toml`
    # declares it only so the copy that `windows` already pulls in is nameable
    # from our own crate root, because `#[implement]` expands to absolute
    # `::windows_core::` paths. Both names must resolve to the SAME version:
    # a mismatched one compiles the generated sink against a different
    # `IUnknownImpl` than the interface it implements, and the COM device
    # watcher stops satisfying its own trait bounds. #642 failed exactly that
    # way, and the comment at the dependency itself predicted it.
    #
    # windows-rs versions its support crates on their own lines, and 0.100.0
    # renumbered that entire layer (windows-core, -implement, -interface,
    # -result, -link) while the generated-bindings crates above it stayed
    # put -- `windows` is still 0.62.2. So a major for `windows-core` alone
    # is never mergeable. Grouping does not help: a group still opens a PR
    # when only one of its members has a release.
    #
    # "Major" covers more than it looks. For a 0.x crate Dependabot treats
    # the minor position as the breaking one, so 0.62 -> 0.63 is a
    # semver-major update here just as 0.62 -> 0.100 is. Every 0.x bump of
    # that shape in this repository has arrived as its own PR instead of
    # inside cargo-patch-and-minor (quick-xml 0.41 -> 0.42, lofty 0.24 ->
    # 0.25, wasapi 0.23 -> 0.24), which is what that classification looks
    # like from the outside. Adding semver-minor to the rule would suppress
    # nothing extra, and would risk holding this name back while `windows`
    # moved -- the same desync, mirrored.
    #
    # `windows` itself is deliberately NOT ignored. The day it offers a major
    # is the day the pair can move, and that PR is the signal to bump both by
    # hand, in one commit.
    ignore:
      - dependency-name: "windows-core"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: "Europe/Zurich"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore
    groups:
      github-actions-all:
        patterns:
          - "*"
