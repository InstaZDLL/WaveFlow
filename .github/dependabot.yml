version: 2

updates:
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Zurich"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - bun
    commit-message:
      prefix: chore
    groups:
      bun-patch-and-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: weekly
      day: monday
      time: "06:10"
      timezone: "Europe/Zurich"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - cargo
    commit-message:
      prefix: chore
    groups:
      cargo-patch-and-minor:
        update-types:
          - minor
          - patch
    # `windows-core` is not an independent dependency. `crates/app/Cargo.toml`
    # declares it only so the copy that `windows` already pulls in is nameable
    # from our own crate root, because `#[implement]` expands to absolute
    # `::windows_core::` paths. Our `windows-core` must therefore resolve to
    # the SAME COPY that `windows` was built against -- not, note, to an
    # equal version string: windows-rs numbers the two lines independently,
    # and `windows 0.61.3` was built against `windows-core 0.61.2`. A
    # mismatched one compiles the generated sink against a different
    # `IUnknownImpl` than the interface it implements, and the COM device
    # watcher stops satisfying its own trait bounds. #642 failed exactly that
    # way, and the comment at the dependency itself predicted it.
    #
    # The rules below only cover the updates Dependabot proposes, so they are
    # half the guard. `scripts/check-windows-core-pair.py` is the other half:
    # it walks the lockfile on every pull request and fails when the two
    # edges part company, whichever route pulled them apart (#653).
    #
    # windows-rs versions its support crates on their own lines, and 0.100.0
    # renumbered that entire layer (windows-core, -implement, -interface,
    # -result, -link) while the generated-bindings crates above it stayed
    # put -- `windows` is still 0.62.2. So neither name can move on its own,
    # in either direction, and a group does not express that: a group still
    # opens a PR when only one of its members has a release.
    #
    # Hence BOTH are held back from everything but patches, and the pair is
    # bumped by hand, in one commit, when upstream realigns. Patches stay
    # automatic and are safe by construction: both names remain inside
    # 0.62.x, which Cargo unifies onto a single version anyway.
    #
    # Major *and* minor, because which of the two a 0.x bump like
    # 0.62 -> 0.63 counts as is NOT settled. GitHub documents SemVer as
    # plain major.minor.patch, which makes it minor; yet every 0.x bump of
    # that shape in this repository has arrived as its own PR instead of
    # inside cargo-patch-and-minor (quick-xml 0.41 -> 0.42, lofty 0.24 ->
    # 0.25, wasapi 0.23 -> 0.24), which is what "major" looks like from the
    # outside -- and `groups` and `ignore` are not obliged to classify
    # alike. Naming both costs nothing and is correct under either reading.
    # Do not "simplify" this back to majors only without settling that.
    #
    # Known cost, accepted: an ignore rule can also hold back a security
    # update that needs a minor bump. Patch-level advisories still flow, and
    # a desync is a build failure on every Windows job, which a stale
    # binding is not.
    ignore:
      - dependency-name: "windows"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "windows-core"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: "Europe/Zurich"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore
    groups:
      github-actions-all:
        patterns:
          - "*"
