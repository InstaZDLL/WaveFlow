name: 功能建议（简体中文）
description: 为 WaveFlow 建议新功能、改进现有功能，或优化界面体验。
title: "feat: <一句话概括建议>"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！WaveFlow 有自己明确的方向：一款以本地为先、专为你自己的音乐文件打造的桌面播放器。符合这一方向的功能，通常会更快落地。你越能说明这项功能*为什么*重要，我们就越容易评估它的范围。

        欢迎用中文填写，我们也会阅读其他语言的建议。

  - type: textarea
    id: problem
    attributes:
      label: 它解决了什么问题？
      description: 描述你想改善的使用场景或痛点。先不用急着给出方案，重点说明“为什么”。
      placeholder: |
        听演唱会现场录音时，相邻曲目之间的自动交叉淡化会把掌声和下一首歌的前奏混在一起。按专辑判断的智能交叉淡化已经能处理录音室专辑，但对于同一艺人、同一年份、却没有统一 `album` 标签的现场录音，它就无能为力了。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
      description: 你希望看到什么样的效果？欢迎附上界面草图、命令名称或伪代码。
      placeholder: |
        增加一条规则：“如果下一首曲目与当前曲目艺人相同，且发行时间相差不到 1 小时，则不进行交叉淡化”，并在现有的智能交叉淡化开关旁边新增一个开关来控制它。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他方案
      description: 解决同一问题的其他办法，以及它们为什么不如你的方案。

  - type: dropdown
    id: scope
    attributes:
      label: 大致规模
      description: 在你看来，这项功能的工作量有多大？仅供分类参考，不作为承诺。
      options:
        - "小（一张卡片 / 一条命令 / 一个菜单项）"
        - "中（涉及多处：后端 + 前端 + 多语言）"
        - "大（新视图 / 新数据模型 / 不兼容的数据库结构变更）"
        - "不确定"
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 其他补充
      description: 其他应用中类似功能的链接、截图、界面草图，或相关的 issue 和讨论。
