name: Bug report
description: Something works incorrectly in WaveFlow — crash, wrong behaviour, missing data.
title: "bug: <one-line summary>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill in as much as you can — repro steps and the exact app version make the difference between "fixed in a day" and "lingers for months".

        You can write in your own language: a [Simplified Chinese form](https://github.com/InstaZDLL/WaveFlow/issues/new?template=bug_report_zh-CN.yml) is available, and a report in any other language is read too.

        Security issues: please **do not** open a public issue. See [`.github/SECURITY.md`](https://github.com/InstaZDLL/WaveFlow/blob/main/.github/SECURITY.md) for the disclosure channel.

  - type: input
    id: version
    attributes:
      label: WaveFlow version
      description: Shown in the avatar menu (top right) → About.
      placeholder: "2.0.1"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 10
        - Windows 11
        - macOS (Intel)
        - macOS (Apple Silicon)
        - Linux (Ubuntu / Debian-based)
        - Linux (Fedora / RHEL-based)
        - Linux (Arch-based)
        - Linux (other distro)
        - Other (specify in the repro section)
    validations:
      required: true

  - type: dropdown
    id: install-source
    attributes:
      label: How did you install WaveFlow?
      options:
        - winget
        - GitHub Releases (NSIS .exe)
        - GitHub Releases (.msi)
        - macOS install script (waveflow.app/install.sh)
        - GitHub Releases (.dmg)
        - AUR (waveflow-bin)
        - COPR (dnf)
        - APT repository (wave-flow)
        - GitHub Releases (.deb)
        - GitHub Releases (.rpm)
        - GitHub Releases (.AppImage)
        - Built from source
        - Other (specify in the repro section)
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug — what you expected vs what actually happened.
      placeholder: |
        Expected: double-clicking a track starts playback.
        Actual: nothing happens, no error in the UI.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps a stranger could follow on a fresh install.
      placeholder: |
        1. Open WaveFlow with a library containing FLAC files.
        2. Go to My music → Tracks.
        3. Double-click any FLAC track.
        4. Observe nothing happens.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / errors
      description: |
        Settings → Maintenance → Diagnostics → **Copy logs** puts the recent log on your clipboard, ready to paste here (**Open folder** shows the files). Focus on the lines near the bug, no need to paste megabytes.
      render: shell

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots (drag-and-drop here), the skin and theme for anything visual, audio file characteristics (codec, sample rate, length), library size, multi-monitor / HiDPI, etc.
