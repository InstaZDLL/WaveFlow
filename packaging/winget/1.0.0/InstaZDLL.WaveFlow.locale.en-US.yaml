ShortDescription: Local-first music player for Windows, macOS & Linux. Hi-Res audio, AutoMix, word-synced lyrics, smart playlists, beautiful themes and plugins. No account or subscription.
Description: |-
  WaveFlow is a local-first music player for Windows, macOS and Linux. It scans your music folders, organizes everything by album, artist and genre, and plays it through its own real-time audio engine. No account, no subscription, no streaming service: your music stays on your machine.

  Hi-Res audio, bit-perfect when you ask for it, with exclusive output, native DSD, 5.1 and 7.1, gapless playback and AutoMix crossfades that land on the beat. Lyrics are synced word by word, with romanization and translations, in the app, the mini-player or a floating desktop window. Smart playlists, Daily Mix and Release Radar build sessions from your library, MusicBrainz fills its gaps, and a tag workshop edits it with an undo.

  Six skins and fourteen themes, podcasts, WebDAV and SMB shares, Last.fm and ListenBrainz scrobbling, DLNA and MPD servers, your own WaveFlow Server, and sandboxed plugins for more lyrics sources, animated covers and web radio.
