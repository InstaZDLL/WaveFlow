  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WaveFlow</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #121212;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
        cursor: default;
      }
      .card {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background:
          radial-gradient(
            120% 80% at 50% 0%,
            rgba(16, 185, 129, 0.18) 0%,
            rgba(16, 185, 129, 0) 60%
          ),
          #121212;
        border-radius: 14px;
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.55);
      }
      /* The stacked lockup on the dark: the mark in mint, the
         wordmark in white, both outlined (no font to load). Flat, as
         the identity asks: no glow, no shadow. */
      .logo {
        width: 160px;
        height: auto;
        display: block;
      }
      .bar {
        position: relative;
        width: 180px;
        height: 3px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .bar::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 40%;
        background: linear-gradient(
          90deg,
          rgba(16, 185, 129, 0) 0%,
          #10b981 50%,
          rgba(16, 185, 129, 0) 100%
        );
        animation: slide 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(350%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .bar::after {
          animation: none;
          width: 100%;
          opacity: 0.6;
        }
      }
    </style>
