# TEST-ONLY fixture — NOT a shipped plugin. Builds a minimal
# `waveflow:ui/v1` component the core integration test
# (`crates/core/tests/plugin_ui.rs`) loads to exercise the UI world
# end-to-end (manifest / render / on-event + the redacted
# `library.read_artists` read). It is deliberately NOT in
# `BUNDLED_PLUGINS` and never copied into `resources/plugins/`, so it
# never reaches a user. Rebuild + refresh the committed fixture wasm
# with `cargo component build --release` from this directory.
#
# Empty workspace marker — same reason as the web-radio plugin: this
# crate owns its own resolution context so `cargo component build`
# for wasm32-wasip2 stays independent of the host workspace.
[workspace]

[package]
name = "waveflow-plugin-ui-fixture"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "WaveFlow test-only UI-world plugin fixture — not shipped"
authors = ["InstaZDLL <github.105mh@8shield.net>"]
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen-rt = { version = "0.44", features = ["bitflags"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package.metadata.component]
package = "waveflow:ui-fixture"

[package.metadata.component.target]
path = "wit"
world = "plugin"

[package.metadata.component.target.dependencies]
"waveflow:host" = { path = "wit/deps/waveflow-host" }

[profile.release]
opt-level = "s"
strip = true
lto = true
codegen-units = 1
