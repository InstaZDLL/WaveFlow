# TEST-ONLY fixture manifest — the granted-permission variant.
# `crates/core/tests/plugin_ui.rs` stages this alongside plugin.wasm
# for the happy path, and writes a second manifest WITHOUT
# `library_read_artists` at test time to exercise the denied path
# against the same wasm.

schema_version = 1

[plugin]
id = "ui-fixture"
name = "UI Fixture"
version = "0.1.0"
author = "InstaZDLL"
description = "Test-only UI-world plugin exercising manifest / render / on-event + the redacted library read. Not shipped."
license = "GPL-3.0-only"
world = "waveflow:ui/v1"

[permissions]
library_read_artists = true
