[package]
name = "waveflow-gtk"
version = "1.7.0"
edition = "2021"
license = "GPL-3.0-only"
description = "WaveFlow native GTK4/libadwaita frontend for Linux"

# GTK4 and Tauri's GTK3 require incompatible glib-sys links versions.
# Keep their dependency resolution separate; share Rust backend path crates.
[workspace]
resolver = "2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { package = "gtk4", version = "0.10", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.8", features = ["v1_4"] }
waveflow-native = { path = "../native" }
waveflow-core = { path = "../core", features = ["sqlite"] }
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
debug = 0

[[bin]]
name = "waveflow-gtk"
path = "src/main.rs"
