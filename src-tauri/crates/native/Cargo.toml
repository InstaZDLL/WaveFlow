[package]
name = "waveflow-native"
version = "1.7.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Native Rust host adapter for the shared WaveFlow desktop backend"

[features]
default = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("sync_v2"))'] }

[dependencies]
waveflow-core = { path = "../core", features = ["sqlite"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono"] }
thiserror = "2"
tracing = "0.1"
dirs = "7"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.11"
uuid = { version = "1", features = ["v4", "v5"] }
symphonia = { version = "0.6", default-features = false, features = ["mp3", "flac", "wav", "aiff", "vorbis", "ogg", "aac", "alac", "isomp4", "pcm", "all-meta"] }
cpal = "0.17"
rubato = "5.0"
rtrb = "0.4"
crossbeam-channel = "0.5"
realfft = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
url = "2"
blake3 = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif", "tiff"] }

[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.10"
libc = "0.2"
zbus = "5"

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"
